name: shell

permissions:
  contents: write

on:
  push: { branches: [ main ] }
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner has no GPU, so Chrome falls back to SwiftShader. That is the point: it shows what
      # a software GPU reports, which is what CI can prove and what a phone with a real GPU will not.
      - name: Run the probe page in headless Chrome
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --enable-unsafe-swiftshader \
            --window-size=720,1280 --virtual-time-budget=20000 \
            --screenshot=probe.png --dump-dom \
            "file://$PWD/android/app/src/main/assets/probe.html" > dom.html 2>chrome.log || true
          echo "--- title ---"; grep -o "<title>[^<]*</title>" dom.html || true
          echo "--- rows ---"; sed -e 's/<[^>]*>/ /g' dom.html | tr -s ' \n' ' \n' | grep -iE "webgpu|memory64|isolated|renderer|compressed|verdict|deviceMemory|hardwareConc" | head -30
      - name: The page must report something rather than crash
        run: |
          test -s dom.html
          grep -q "What this browser engine can do" dom.html
          grep -qiE "webgpu" dom.html
      - uses: actions/upload-artifact@v4
        with: { name: probe-screenshot, path: probe.png }
      - uses: actions/upload-artifact@v4
        with: { name: probe-dom, path: dom.html }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the shell
        working-directory: android
        run: gradle --no-daemon --console=plain assembleDebug
      - name: The APK carries the probe and no Blender
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E "classes.dex|assets/probe.html|AndroidManifest.xml"
          echo "size: $(stat -c%s "$APK") bytes"
          # The shell must stay a shell: nothing here should be tens of megabytes of Blender.
          test "$(stat -c%s "$APK")" -lt 5000000
      - uses: actions/upload-artifact@v4
        with: { name: blender-lite-shell-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }

  pack:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the Blender web payload into a release of this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh api repos/$GITHUB_REPOSITORY/releases/tags/blender-pack-v1 --jq .id >/dev/null 2>&1; then
            echo "pack release already exists"; exit 0
          fi
          U=https://developer.puter.com/labs/blender-web
          mkdir -p pack && cd pack
          curl -sS -O $U/blender.wasm.zst -O $U/assets.tar.zst -O $U/wgsl-cache.json
          ls -l
          python3 "$GITHUB_WORKSPACE/tools/pack_manifest.py"
          gh release create blender-pack-v1 manifest.json blender.wasm.zst assets.tar.zst wgsl-cache.json \
            --title "Blender web payload mirror" \
            --notes "Mirror of the puter Blender-web payload (upstream: heyputer/blender-wasm, GPL) so the Android shell can serve it from its own origin when the upstream host is unreachable."

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the PWA locally and load it in headless Chrome
        run: |
          (cd docs && python3 -m http.server 8000 --bind 127.0.0.1 &)
          sleep 2
          google-chrome --headless=new --no-sandbox --enable-unsafe-swiftshader \
            --window-size=480,800 --virtual-time-budget=15000 \
            --screenshot=pwa.png --dump-dom http://127.0.0.1:8000/ > pwa-dom.html || true
          grep -q "manifest.webmanifest" pwa-dom.html
          grep -q "sw.js" pwa-dom.html
          grep -q "progress.js" pwa-dom.html
          grep -q "Cross-Origin-Embedder-Policy" docs/sw.js
          test -s docs/icon-512.png
      - uses: actions/upload-artifact@v4
        with: { name: pwa-screenshot, path: pwa.png }

  single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the one-file html and smoke-test it from file://
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p payload && cd payload
          B=https://github.com/$GITHUB_REPOSITORY/releases/download/blender-pack-v1
          curl -sSL -O $B/blender.wasm.zst -O $B/assets.tar.zst -O $B/wgsl-cache.json -O $B/manifest.json
          cd ..
          python3 tools/make_single_html.py blender-lite-single.html payload docs
          test "$(stat -c%s blender-lite-single.html)" -gt 50000000
          google-chrome --headless=new --no-sandbox --enable-unsafe-swiftshader \
            --window-size=480,900 --virtual-time-budget=120000 --enable-logging=stderr \
            --screenshot=single.png --dump-dom "file://$PWD/blender-lite-single.html" > single-dom.html 2>chrome.log || true
          echo "--- dom text ---"
          sed -e 's/<[^>]*>/ /g' single-dom.html | tr -s ' \n' ' \n' | head -c 1200
          echo; echo "--- console ---"
          grep -iE "CONSOLE|Uncaught|failed|FAIL" chrome.log | cut -c1-200 | head -25
          grep -q "verified blender.wasm.zst" single-dom.html
          grep -q "verified assets.tar.zst" single-dom.html
          gh release upload blender-pack-v1 blender-lite-single.html --clobber || echo "release upload skipped"
      - uses: actions/upload-artifact@v4
        with: { name: single-file-dom, path: single-dom.html }
      - uses: actions/upload-artifact@v4
        with: { name: single-file-screenshot, path: single.png }
